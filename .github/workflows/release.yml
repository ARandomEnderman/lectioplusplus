name: 'release extension'

# Releases the LectioPlus+ extension for Chrome and Safari automatically:
# on every push to main that touches the extension, if "version" in
# apps/lectioplus/extension/manifest.json has no vX.Y.Z tag yet, the extension
# is built and published as release vX.Y.Z (the tag is created by the release).
# To release, bump the version and push to main. Can also be run by hand.
# Asset names carry no version, so .../releases/latest/download/<name> always
# points at the newest build (the Safari install script relies on this).
on:
  push:
    branches: [main]
    paths:
      - 'apps/lectioplus/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-extension
  cancel-in-progress: false

env:
  EXTENSION_DIR: apps/lectioplus/extension

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this manifest version already released?
        id: check
        run: |
          tag="v$(jq -r .version "$EXTENSION_DIR/manifest.json")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  chrome:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo name is only filled in at build time so it is never committed.
      - name: Fill in repository for update checks
        run: sed -i "s|__GITHUB_REPOSITORY__|$GITHUB_REPOSITORY|g" "$EXTENSION_DIR/popup.js" apps/lectioplus/safari/install.sh

      - name: Package for Chrome and Edge
        run: |
          mkdir -p dist
          (cd "$EXTENSION_DIR" && zip -r -X "$GITHUB_WORKSPACE/dist/lectioplus-chrome.zip" .)
          cp apps/lectioplus/safari/install.sh dist/install-safari.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: dist/*

  safari:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill in repository for update checks
        run: sed -i '' "s|__GITHUB_REPOSITORY__|$GITHUB_REPOSITORY|g" "$EXTENSION_DIR/popup.js"

      - name: Convert to a Safari web extension project
        run: |
          xcrun safari-web-extension-converter "$EXTENSION_DIR" \
            --project-location build \
            --app-name LectioPlus \
            --bundle-identifier dk.lectioplus.extension \
            --swift --macos-only --copy-resources \
            --no-open --no-prompt --force

      - name: Build the Safari app (ad-hoc signed)
        run: |
          project=$(find build -maxdepth 2 -name '*.xcodeproj' | head -n 1)
          xcodebuild -project "$project" -alltargets -configuration Release \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SYMROOT="$GITHUB_WORKSPACE/build/products"

      - name: Package for Safari
        run: |
          mkdir -p dist
          app=$(find build/products -maxdepth 3 -name 'LectioPlus.app' | head -n 1)
          ditto -c -k --keepParent "$app" dist/lectioplus-safari-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: safari
          path: dist/*.zip

  release:
    needs: [version, chrome, safari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LectioPlus+ ${{ needs.version.outputs.tag }}
          files: dist/*
          body: |
            ## Safari (macOS): installér eller opdatér
            Kør denne kommando i Terminal. Kør den igen, når der kommer en ny version:
            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-safari.sh | bash
            ```
            Første gang skal Safari tillade usignerede udvidelser, fordi appen ikke er signeret af Apple:
            1. **Safari → Indstillinger → Avanceret →** slå funktioner til webudviklere til.
            2. Vælg **Udvikler → Tillad usignerede udvidelser** (skal gøres igen, hver gang Safari genstartes).
            3. Slå LectioPlus+ til under **Indstillinger → Udvidelser**.

            Kræver Safari 16 eller nyere.

            ## Chrome og Edge
            1. Hent `lectioplus-chrome.zip`, og pak den ud.
            2. Åbn `chrome://extensions` (eller `edge://extensions`), og slå **Udviklertilstand** til.
            3. Vælg **Indlæs udpakket**, og vælg den udpakkede mappe.
            4. Ved en ny version: pak den nye zip ud oven i den gamle mappe, og tryk **Genindlæs** på LectioPlus+.

            LectioPlus+ viser en besked i udvidelsens menu, når der er en ny version.
